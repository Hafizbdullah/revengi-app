name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk

      # خطوة معالجة تلقائية لتخطي الأسطر المسببة للخطأ في ملف parser.rs
      - name: Patch YARA-X Dex Parser
        run: |
          FILE="android/yarax_android/yarax_patches/yara-x/lib/src/modules/dex/parser.rs"
          if [ -f "$FILE" ]; then
            sed -i 's/result\.set_/# result.set_/g' "$FILE" || true
            sed -i 's/result\.set_/\/\/ result.set_/g' "$FILE" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi
