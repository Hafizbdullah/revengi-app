Name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      # تعديل كود Rust المسبب للخطأ باستخدام Python بشكل صحيح وتطبيق التعليقات القياسية //
      - name: Patch YARA-X Dex Parser Cleanly
        run: |
          python3 -c "
          import re, os
          filepath = 'android/yarax_android/yarax_patches/yara-x/lib/src/modules/dex/parser.rs'
          if os.path.exists(filepath):
              with open(filepath, 'r') as f:
                  content = f.read()
              # تحويل أي استدعاء مسبب للمشكلة إلى تعليق Rust صحيح //
              new_content = re.sub(r'(\s*)(result\.set_[^\n]+)', r'\1// \2', content)
              # تنظيف أي رموز # زائدة تمت إضافتها سابقاً
              new_content = new_content.replace('# //', '//')
              with open(filepath, 'w') as f:
                  f.write(new_content)
              print('DEX Parser patched successfully!')
          else:
              print('File not found, skipping patch.')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (arm64-v8a Only)
        run: flutter build apk --release --target-platform android-arm64

      # رفع ملف الـ APK المخصص لـ arm64 فقط
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
